version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      - pip install uv
    
    post_install:
      - uv sync --only-group doc # Install only document dependencies

# Build documentation with Mkdocs
mkdocs:
  configuration: mkdocs.yml

python:
    install:
      - method: uv