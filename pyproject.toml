[project]
name = "linkedin-games"
version = "0.1.3"
description = "A Python package for solving LinkedIn board games like Queens, Tango, Zip, Mini Sudoku and Patches using linear optimization models."
keywords = [
    "LinkedIn Games",
    "LinkedIn",
    "Games",
    "Queens",
    "Tango",
    "Zip",
    "Mini Sudoku",
    "Patches",
    "Pyomo",
    "Optimization",
    "Linear Optimization"
]
authors = [{ name = "Rodrigo C. L. Porto", email = "rodrigo.cl.porto@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE.md" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment"
]
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.14.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pyomo>=6.10.0",
]

[project.urls]
"Source Code" = "https://github.com/rodrigo-cl-porto/linkedin-games-solvers"
"Jupyter Book" = "https://rodrigo-cl-porto.github.io/linkedin-games-solvers/"
"LinkedIn Profile" = "https://www.linkedin.com/in/rodrigo-cl-porto/"

[dependency-groups]
book = [
    "ipywidgets>=8.1.8",
    "jupyter-book>=2.1.6",
    "jupyterlab>=4.6.2",
    "jupyterlab-myst>=2.7.0",
]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
doc = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.5",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 112

[tool.ruff.lint]
exclude = ["*.ipynb"]
select = ["E", "F", "I", "UP"]
ignore = ["E741"]


[tool.poe]
executor = "uv"
verbosity = -1

[tool.poe.tasks.clean]
cmd = "rm -rf .venv"

[tool.poe.tasks.start]
cmd = """
uv venv --python 3.13
uv python pin 3.13
uv sync --all-groups --all-extras
"""

[tool.poe.tasks.restart]
sequence = ["clean", "start"]

[tool.poe.tasks.docs]
cmd = "mkdocs serve --livereload"

[tool.poe.tasks.serve-book]
cmd = "jupyter-book start"
cwd = "book"
env = { NODE_TLS_REJECT_UNAUTHORIZED = "0" }

[tool.poe.tasks.build-book]
cmd = "jupyter-book build --html"
cwd = "book"
env = { NODE_TLS_REJECT_UNAUTHORIZED = "0" }

[tool.poe.tasks.deploy-book]
cmd = "jupyter-book init --gh-pages"
cwd = "book"

[tool.poe.tasks.test]
cmd = "pytest tests --maxfail=1"

[tool.poe.tasks.lint]
cmd = "ruff check"

[tool.poe.tasks.publish]
cmd = """
    poe test
    uv build --no-sources
    uv publish
"""
envfile=".env"
