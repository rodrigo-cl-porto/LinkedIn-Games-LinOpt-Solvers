[project]
name = "linkedin-games"
version = "0.1.3"
description = "A Python package for solving LinkedIn mini games like Queens, Tango, Zip, Mini Sudoku and Patches using linear optimization models."
keywords = [
    "LinkedIn Games",
    "LinkedIn",
    "Games",
    "Queens",
    "Tango",
    "Zip",
    "Mini Sudoku",
    "Patches",
    "Pyomo",
    "Optimization",
    "Linear Optimization"
]
authors = [{ name = "Rodrigo Celso de Lima Porto", email = "rodrigo.cl.porto@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE.md" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment"
]
requires-python = ">=3.13"
dependencies = [
    "gurobipy>=13.0.1",
    "highspy>=1.14.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pyomo>=6.10.0",
]

[project.urls]
"Source Code" = "https://github.com/rodrigo-cl-porto/Solving-LinkedIn-Games-by-Linear-Optimization"
"Jupyter Book" = "https://rodrigo-cl-porto.github.io/Solving-LinkedIn-Games-by-Linear-Optimization/"
"LinkedIn Profile" = "https://www.linkedin.com/in/rodrigo-cl-porto/"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyter-book>=2.1.4",
    "jupyterlab>=4.5.6",
    "jupyterlab-myst>=2.6.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}
packages = ["linkedin_games"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = ["E741"] # Ambiguous variable name


[tool.poe.tasks]

clean = "rm -rf .venv"

setup = [
    { cmd = "uv venv --python 3.13" },
    { cmd = "uv python pin 3.13" },
    { cmd = "uv sync" }
]

book-serve = { cmd = "jupyter-book start", cwd = "book", env = { NODE_TLS_REJECT_UNAUTHORIZED = "0" } }

build = { cmd = "jupyter-book build --html", cwd = "book", env = { NODE_TLS_REJECT_UNAUTHORIZED = "0" } }

deploy = { cmd = "jupyter-book init --gh-pages", cwd = "book" }

test = "pytest tests --maxfail=1"

lint = "ruff check"
