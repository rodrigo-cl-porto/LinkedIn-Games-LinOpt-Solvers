[project]
name = "linkedin-games"
version = "0.1.7"
description = "A Python package for solving LinkedIn board games like Queens, Tango, Zip, Mini Sudoku and Patches using Linear Optimization models."
keywords = [
    "LinkedIn Games",
    "LinkedIn",
    "Games",
    "Queens",
    "Tango",
    "Zip",
    "Mini Sudoku",
    "Patches",
    "Pyomo",
    "Optimization",
    "Linear Optimization"
]
authors = [{ name = "Rodrigo C. L. Porto", email = "rodrigo.cl.porto@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE.md" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Intended Audience :: Education",
    "Topic :: Games/Entertainment"
]
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.14.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "pyomo>=6.10.0",
]

[project.markdown_extensions]
mkdocstrings = { handler = "python" }

[project.urls]
"Source Code" = "https://github.com/rodrigo-cl-porto/LinkedIn-Games-LinOpt-Solvers"
"Jupyter Book" = "https://rodrigo-cl-porto.github.io/LinkedIn-Games-LinOpt-Solvers/"
"Documentation" = "https://linkedin-games-linopt-solvers.readthedocs.io/"
"LinkedIn Profile" = "https://www.linkedin.com/in/rodrigo-cl-porto/"
"GitHub Profile" = "https://github.com/rodrigo-cl-porto"

[dependency-groups]
book = [
    "ipywidgets>=8.1.8",
    "jupyter-book>=2.1.6",
    "jupyterlab>=4.6.2",
    "jupyterlab-myst>=2.7.0",
]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.52",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"


[tool.ruff] # https://docs.astral.sh/ruff/
line-length = 120
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
exclude = ["*.ipynb"]
select = [
    "ASYNC",
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "FIX",
    "I",
    "ICN",
    "ISC",
    "Q",
    "RET",
    "RSE",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TRY",
    "UP",
    "W",
    "YTT",
    "RUF",
    "N",
]
ignore = [
    "T201",
    "T203", # p-print
    "N806", # non-lowercase-variable-in-function
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean-typed positional argument in function definition
    "COM812",
    "I001",
    "E741",
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "W293"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.poe] # https://poethepoet.natn.io/index.html
executor = "uv"
verbosity = -1

[tool.poe.tasks.clean]
help = "Remove all unnecessary files and folders (except .venv)."
shell = """
    rm -rf dist &
    rm -rf .pytest_cache &
    rm -rf .ruff_cache &
    rm -rf docs/_build &
    rm -rf book/_build
"""

[tool.poe.tasks.clean-venv]
help = "Remove all unnecessary files and folders (including the .venv)."
deps = ["clean"]
cmd = "rm -rf .venv"

[tool.poe.tasks.sync]
help = "Install all the project dependencies."
cmd = "uv sync --all-groups"

[tool.poe.tasks.docs]
help = "Serve the documentation site."
cmd = "zensical serve"

[tool.poe.tasks.book]
help = "Serve the Jupyter Book site."
cmd = "jupyter-book start"
cwd = "book"
env = { NODE_TLS_REJECT_UNAUTHORIZED = "0" }

[tool.poe.tasks.test]
help = "Run all the automatic tests."
cmd = "pytest --maxfail=1"
cwd = "tests"

[tool.poe.tasks.lint]
help = "Lint the code using Ruff linter."
cmd = "ruff check"

[tool.poe.tasks.build]
help = "Build the Python package to dist folder."
shell = """
    rm -rf dist &
    uv build --no-sources
"""

[tool.poe.tasks.publish]
help = "Publish the built package to PyPI (Python Package Index) site."
cmd = "uv publish --system-certs"
envfile=".env"

[tool.poe.tasks.deploy]
help = "Lint and test the code before building and publishing the Python package to PyPI."
sequence = ["lint", "test", "build", "publish"]
