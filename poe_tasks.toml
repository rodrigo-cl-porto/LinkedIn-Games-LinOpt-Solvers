# Task Runner: [Poe the Poet](https://poethepoet.natn.io/index.html)

executor = "uv"
verbosity = -1

[tasks.clean]
help = "Remove all unnecessary files and folders (except .venv)."
shell = """
    rm -rf dist &
    rm -rf .pytest_cache &
    rm -rf .ruff_cache &
    rm -rf docs/_build &
    rm -rf book/_build
"""

[tasks.clean-venv]
help = "Remove all unnecessary files and folders (including the .venv)."
deps = ["clean"]
cmd = "rm -rf .venv"

[tasks.sync]
help = "Install all the project dependencies."
cmd = "uv sync --all-groups"

[tasks.docs]
help = "Serve the documentation site."
cmd = "zensical serve"

[tasks.book]
help = "Serve the Jupyter Book site."
cmd = "jupyter-book start"
cwd = "book"
env = { NODE_TLS_REJECT_UNAUTHORIZED = "0" }

[tasks.test]
help = "Run all the automatic tests."
cmd = "pytest --maxfail=1 -vv --durations=0"
cwd = "tests"

[tasks.lint]
help = "Lint the code using Ruff linter."
cmd = "ruff check"

[tasks.build]
help = "Build the Python package to dist folder."
shell = """
    rm -rf dist &
    uv build --no-sources
"""

[tasks.test-publish]
help = "Publish the built package to TestPyPI via OIDC"
cmd = "uv publish --system-certs --index testpypi --token $UV_TEST_PUBLISH_TOKEN"
envfile=".env"

[tasks.test-deploy]
help = "Lint and test the code before building and publishing the Python package to TestPyPI."
sequence = ["lint", "test", "build", "test-publish"]

[tasks.publish]
help = "Publish the built package to PyPI (Python Package Index) site."
cmd = "uv publish --system-certs"
envfile=".env"

[tasks.deploy]
help = "Lint and test the code before building and publishing the Python package to PyPI."
sequence = ["lint", "test", "build", "publish"]
