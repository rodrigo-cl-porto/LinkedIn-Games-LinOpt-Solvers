name: Publish to TestPyPI

on:
  push:
    branches:
      - main  # Triggers the workflow when pushing code to the main branch
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub UI

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to checkout code

    steps:
      - name: Copy the Repo to Virtual Server
        uses: actions/checkout@v6
        with:
          sparse-checkout: | # Avoid copying unnecessary folder to virtual server.
            /*
            !/docs
            !/book
            !/tests

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build distribution packages
        run: uv build --no-sources

  publish-testpypi:
    name: Publish to TestPyPI via OIDC
    needs: build
    runs-on: ubuntu-latest
    
    # Required for GitHub OIDC Trusted Publishing authentication
    permissions:
      id-token: write

    # Matches the environment name configured on TestPyPI
    environment:
      name: testpypi
      url: https://pypi.org

    steps:
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
