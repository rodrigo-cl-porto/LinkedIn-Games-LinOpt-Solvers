  title: Solving LinkedIn Games by Linear Optimization
  subtitle: Solving LinkedIn Games by Linear Optimization with Pyomo and NetworkX libraries
  description: This Jupyter Book presents examples on how to solve LinkedIn minigames by using Python libraries, such as Pyomo, for mathematical modeling, and NetworkX, for graph modeling.
  parts:
    abstract: |
      This Jupyter Book presents examples on how to solve LinkedIn minigames by using Python libraries, such as Pyomo, for mathematical modeling, and NetworkX, for graph modeling.
      The minigames are solved by formulating them as Linear Optimization Problems (LOPs) and solving them with the Gurobi and Highs solvers.
      This book also provides a brief introduction to Linear Optimization (LO) and its applications in solving real-world problems.
